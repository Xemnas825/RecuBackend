services:
  db:
    image: postgres:16
    container_name: recubackend-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recubackend}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - recubackend_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: RecuBackend.Api/Dockerfile
    container_name: recubackend-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AppDb: "Host=db;Port=5432;Database=${POSTGRES_DB:-recubackend};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Secret: ${JWT_SECRET:-RecuBackend-DnD-Super-Secret-Key-Min-32-Chars!}
      FileStorage__RootPath: /app/uploads
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - recubackend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./RecuFrontend
      dockerfile: Dockerfile
    container_name: recubackend-web
    environment:
      API_BASE_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  recubackend_db:
  recubackend_uploads:


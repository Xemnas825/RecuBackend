services:
  db:
    image: postgres:16
    container_name: recubackend-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recubackend}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - recubackend_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: RecuBackend.Api/Dockerfile
    container_name: recubackend-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AppDb: "Host=db;Port=5432;Database=${POSTGRES_DB:-recubackend};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Secret: ${JWT_SECRET:-RecuBackend-DnD-Super-Secret-Key-Min-32-Chars!}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  recubackend_db:

